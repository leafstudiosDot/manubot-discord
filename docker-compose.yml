services:
  manubot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manubot
    init: true
    env_file:
      - .env
    environment:
      MANUBOT_ENV: production
      DB_PATH: /data/manubot.db
      BACKUP_DIR: /data/backups
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-6540}
      # Set to false only for deliberate local HTTP testing. HTTPS is required
      # for Secure session cookies in production.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    ports:
      - "${API_PORT:-6540}:${API_PORT:-6540}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
